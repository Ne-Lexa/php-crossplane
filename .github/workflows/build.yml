name: build

on:
  - push
  - pull_request

jobs:
  tests:
    name: PHP ${{ matrix.php }} Test on ${{ matrix.os }}

    env:
      extensions: iconv, mbstring, json
      PHPUNIT_COVERAGE: 0
      PHP_INI: date.timezone='UTC', memory_limit=-1

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        php:
          - '7.1'
          - '7.2'
          - '7.3'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP with extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.extensions }}
          coverage: pcov
          ini-values: ${{ env.PHP_INI }}
          tools: composer:v2

      - name: Determine composer cache directory
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> $GITHUB_ENV

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php${{ matrix.php }}-${{ matrix.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: php${{ matrix.php }}-${{ matrix.os }}-composer-

      - name: Check PHP Version
        run: php -v

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Install dependencies with composer
        run: composer update --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Run tests with phpunit
        run: vendor/bin/phpunit -c phpunit.dist.xml
